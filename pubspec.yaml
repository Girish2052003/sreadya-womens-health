name: sreva
description: A private, local-first women's cycle companion.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

flutter:
  uses-material-design: true
  generate: true

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.2
  drift: ^2.35.0
  sqlite3: ^3.6.0
  flutter_secure_storage: ^11.1.1
  local_auth: ^3.0.2
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  qr_flutter: ^4.1.0
  file_picker: ^13.0.0
  path_provider: ^2.1.6
  timezone: ^0.11.1
  uuid: ^4.5.1
  archive: ^4.0.7
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.6.0

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

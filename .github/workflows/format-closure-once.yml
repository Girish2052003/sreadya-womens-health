name: Format Sreva closure tree once

on:
  push:
    branches: [feat/worldwide-v1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldwide-v1
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        run: dart format lib test tool
      - name: Remove one-shot workflow and commit formatting
        run: |
          git config user.name "Sreva CI"
          git config user.email "132274277+Girish2052003@users.noreply.github.com"
          git rm .github/workflows/format-closure-once.yml
          git add -A
          git commit -m "style: apply canonical Dart formatting for closure"
          git push origin HEAD:feat/worldwide-v1

name: C2 Format Probe

on:
  push:
    branches:
      - feat/c2-a-g-implementation

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.repository == 'Girish2052003/sreva-womens-health' && github.actor == 'Girish2052003' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Show canonical Dart formatter diff
        run: |
          dart format test/conformance/shared_prediction_vectors_test.dart test/conformance/shared_reminder_vectors_test.dart
          git diff -- test/conformance/shared_prediction_vectors_test.dart test/conformance/shared_reminder_vectors_test.dart

name: Finalize branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-non-main-branches:
    if: contains(github.event.head_commit.message, '[finalize-branches]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin \
              | awk '{print $2}' \
              | sed 's#refs/heads/##' \
              | sort
          )

          printf 'Branches before cleanup:\n'
          printf ' - %s\n' "${branches[@]}"

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting remote branch: $branch"
            git push origin --delete "$branch"
          done

          mapfile -t remaining < <(
            git ls-remote --heads origin \
              | awk '{print $2}' \
              | sed 's#refs/heads/##' \
              | sort
          )

          printf 'Branches after cleanup:\n'
          printf ' - %s\n' "${remaining[@]}"

          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != "main" ]]; then
            echo 'Branch cleanup verification failed.' >&2
            exit 1
          fi

          echo 'Branch cleanup PASS: main is the only remote branch.'

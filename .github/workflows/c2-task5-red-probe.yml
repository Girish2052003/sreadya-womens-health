name: C2 Task 5 RED Probe

on:
  push:
    branches: [feat/c2-a-g-implementation]

permissions:
  contents: read

jobs:
  web-smoke-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Install RED-harness dependencies without creating repository state
        working-directory: web
        run: npm install --no-package-lock --ignore-scripts
      - name: Run Task 5 smoke RED
        working-directory: web
        run: npm test -- --run

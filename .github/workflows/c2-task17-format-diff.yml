name: C2 Task 17 Dart Format Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dart-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Print exact Dart formatter diff
        run: |
          dart format test/conformance/cyclevault_vectors_test.dart
          echo '--- DART FORMAT DIFF START ---'
          git diff -- test/conformance/cyclevault_vectors_test.dart
          echo '--- DART FORMAT DIFF END ---'

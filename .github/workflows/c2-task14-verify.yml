name: C2 Task 14 Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-cyclevault-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install locked Flutter dependencies
        run: flutter pub get
      - name: CycleVault v1 interoperability vectors
        run: flutter test test/conformance/cyclevault_vectors_test.dart

  web-cyclevault-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Strict TypeScript
        working-directory: web
        run: npm run typecheck
      - name: CycleVault v1 Web conformance
        working-directory: web
        run: npm test -- --run src/crypto/cyclevault.conformance.test.ts
      - name: Static export with CycleVault verification harness
        working-directory: web
        env:
          NEXT_PUBLIC_SREVA_CYCLEVAULT_TEST_HARNESS: '1'
        run: npm run build
      - name: Install target browser engines
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: CycleVault target-browser vector and resource proof
        working-directory: web
        run: npx playwright test e2e/cyclevault-browser.spec.ts

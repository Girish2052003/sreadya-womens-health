name: Integration Dart Format Diagnostic

on:
  push:
    branches:
      - integration/main-through-task23
    paths:
      - '.github/workflows/integration-dart-format-diagnostic.yml'
      - 'test/conformance/e2ee_v1_vectors_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-dart-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Print exact Dart 3.13.2 formatter diff
        run: |
          dart format test/conformance/e2ee_v1_vectors_test.dart
          git --no-pager diff -- test/conformance/e2ee_v1_vectors_test.dart
          git diff --exit-code -- test/conformance/e2ee_v1_vectors_test.dart

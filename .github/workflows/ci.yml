name: Sreva CI

on:
  push:
    branches: [main, feat/worldwide-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: python -m py_compile tool/configure_platforms.py tool/configure_android_tests.py tool/privacy_scan.py tool/generate_sbom.py
      - run: python -m pip install pytest
      - run: python -m pytest -q verification/reference
      - run: python tool/privacy_scan.py
      - name: Dependency vulnerability scan (OSV)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.3 \
            scan source --recursive /src
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p build/security
          dart pub deps --json > build/security/pub-deps.json
          python tool/generate_sbom.py build/security/pub-deps.json build/security/sreva-cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sreva-security-evidence
          path: |
            build/security/sreva-cyclonedx.json
            pubspec.lock
          retention-days: 30

  android-unsigned:
    runs-on: ubuntu-latest
    needs: flutter-core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate Android host
        run: flutter create --platforms=android --org com.sreva.health .
      - name: Install Sreva Android native bridge and privacy configuration
        run: |
          python3 tool/configure_platforms.py android
          python3 tool/configure_platforms.py android --check
      - name: Install Android native regression tests
        run: |
          python3 tool/configure_android_tests.py
          python3 tool/configure_android_tests.py --check
      - name: Run Android Kotlin release unit tests
        working-directory: android
        run: ./gradlew testReleaseUnitTest --stacktrace
      - name: Build Android release AAB
        run: flutter build appbundle --release
      - name: Build Android installable release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sreva-android-release-unsigned-store
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios-no-codesign:
    runs-on: macos-26
    needs: flutter-core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate iOS host
        run: flutter create --platforms=ios --org com.sreva.health .
      - name: Install Sreva iOS native bridge and privacy configuration
        run: |
          python3 tool/configure_platforms.py ios
          python3 tool/configure_platforms.py ios --check
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: sreva-ios-unsigned-release
          path: build/ios/iphoneos/Runner.app
          retention-days: 30

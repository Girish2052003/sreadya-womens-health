name: Sreva CI

on:
  push:
    branches: [main, feat/worldwide-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: python -m py_compile tool/configure_platforms.py tool/configure_android_tests.py tool/configure_android_release.py tool/privacy_scan.py tool/generate_sbom.py
      - run: python -m pip install pytest
      - run: python -m pytest -q verification/reference
      - run: python tool/privacy_scan.py
      - name: Dependency vulnerability scan (OSV)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.3 \
            scan source --recursive /src
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p build/security
          dart pub deps --json > build/security/pub-deps.json
          python tool/generate_sbom.py build/security/pub-deps.json build/security/sreva-cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sreva-security-evidence
          path: |
            build/security/sreva-cyclonedx.json
            pubspec.lock
          retention-days: 30

  android-release-verification:
    runs-on: ubuntu-latest
    needs: flutter-core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate Android host
        run: flutter create --platforms=android --org com.sreva.health .
      - name: Install Sreva Android native bridge and privacy configuration
        run: |
          python3 tool/configure_platforms.py android
          python3 tool/configure_platforms.py android --check
      - name: Enforce Play target API and release-signing policy
        run: |
          python3 tool/configure_android_release.py
          python3 tool/configure_android_release.py --check
      - name: Install Android native regression tests
        run: |
          python3 tool/configure_android_tests.py
          python3 tool/configure_android_tests.py --check
      - name: Run Android Kotlin release unit tests
        working-directory: android
        run: ./gradlew testReleaseUnitTest --stacktrace
      - name: Create ephemeral CI upload key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/sreva-ci-upload.jks" \
            -storepass sreva-ci-store-pass \
            -keypass sreva-ci-key-pass \
            -alias sreva-ci-upload \
            -keyalg RSA \
            -keysize 3072 \
            -validity 2 \
            -dname "CN=Sreva CI, OU=Verification, O=Sreva, C=FI"
      - name: Verify production-signing path with ephemeral key
        env:
          SREVA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sreva-ci-upload.jks
          SREVA_ANDROID_KEYSTORE_PASSWORD: sreva-ci-store-pass
          SREVA_ANDROID_KEY_ALIAS: sreva-ci-upload
          SREVA_ANDROID_KEY_PASSWORD: sreva-ci-key-pass
        run: python3 tool/configure_android_release.py --require-signing
      - name: Build signed Android release AAB and APK
        env:
          SREVA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sreva-ci-upload.jks
          SREVA_ANDROID_KEYSTORE_PASSWORD: sreva-ci-store-pass
          SREVA_ANDROID_KEY_ALIAS: sreva-ci-upload
          SREVA_ANDROID_KEY_PASSWORD: sreva-ci-key-pass
        run: |
          flutter build appbundle --release
          flutter build apk --release
      - name: Verify Android signatures and package artifacts
        run: |
          jarsigner -verify -strict -certs build/app/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sreva-android-v1-ci-test-signed
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios-no-codesign:
    runs-on: macos-26
    needs: flutter-core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate iOS host
        run: flutter create --platforms=ios --org com.sreva.health .
      - name: Install Sreva iOS native bridge and privacy configuration
        run: |
          python3 tool/configure_platforms.py ios
          python3 tool/configure_platforms.py ios --check
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: sreva-ios-unsigned-release
          path: build/ios/iphoneos/Runner.app
          retention-days: 30

name: Sreva CI

on:
  push:
    branches: [main, feat/worldwide-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: python -m py_compile tool/configure_platforms.py tool/privacy_scan.py
      - run: python -m pip install pytest
      - run: python -m pytest -q verification/reference/test_sreva_reference.py
      - run: python tool/privacy_scan.py

  android-unsigned:
    runs-on: ubuntu-latest
    needs: flutter-core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate Android host
        run: flutter create --platforms=android --org com.sreva.health .
      - name: Install Sreva Android native bridge and privacy configuration
        run: |
          python3 tool/configure_platforms.py android
          python3 tool/configure_platforms.py android --check
      - run: flutter build appbundle --release

  ios-no-codesign:
    runs-on: macos-26
    needs: flutter-core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate iOS host
        run: flutter create --platforms=ios --org com.sreva.health .
      - name: Install Sreva iOS native bridge and privacy configuration
        run: |
          python3 tool/configure_platforms.py ios
          python3 tool/configure_platforms.py ios --check
      - run: flutter build ios --release --no-codesign

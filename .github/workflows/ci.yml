name: Sreadya CI

on:
  push:
    branches: [main, feat/worldwide-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sreadya-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: python -m py_compile tool/configure_platforms.py tool/configure_android_tests.py tool/configure_android_release.py tool/configure_android_preview.py tool/verify_android_signatures.py tool/verify_v1_traceability.py tool/release_backlog_scan.py tool/privacy_scan.py tool/secret_scan.py tool/generate_sbom.py tool/generate_web_surface_ledger.py
      - run: python -m pip install pytest
      - run: python -m pytest -q verification/reference
      - name: Verify exhaustive worldwide-v1 traceability
        run: python tool/verify_v1_traceability.py
      - name: Verify deterministic Task 25 evidence ledger
        run: python tool/generate_cross_platform_evidence.py --check
      - name: Verify explicit 258-ID cross-platform traceability
        run: python tool/verify_cross_platform_traceability.py
      - name: Verify explicit Web user-surface ledger
        run: python tool/generate_web_surface_ledger.py --check
      - name: Fail on release backlog markers
        run: python tool/release_backlog_scan.py
      - run: python tool/privacy_scan.py
      - name: Scan repository for committed credentials
        run: python tool/secret_scan.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: sync_service/go.sum
      - name: Scan Go modules with the required toolchain
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          (cd sync_service && govulncheck ./...)
          (cd verification/reference/task19_go && govulncheck ./...)
      - name: Dependency vulnerability scan (OSV, Dart and Web locks)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.3 \
            scan source -L /src/pubspec.lock -L /src/web/package-lock.json
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p build/security
          dart pub deps --json > build/security/pub-deps.json
          python tool/generate_sbom.py build/security/pub-deps.json build/security/sreadya-cyclonedx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sreadya-security-evidence
          path: |
            build/security/sreadya-cyclonedx.json
            pubspec.lock
          retention-days: 30

  android-release-verification:
    runs-on: ubuntu-latest
    needs: flutter-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate Android host
        run: flutter create --platforms=android --org com.sreadya.health .
      - name: Install Sreadya Android native bridge and privacy configuration
        run: |
          python3 tool/configure_platforms.py android
          python3 tool/configure_platforms.py android --check
      - name: Enforce Play target API and release-signing policy
        run: |
          python3 tool/configure_android_release.py
          python3 tool/configure_android_release.py --check
      - name: Install Android native regression tests
        run: |
          python3 tool/configure_android_tests.py
          python3 tool/configure_android_tests.py --check
      - name: Run Android Kotlin release unit tests
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest --stacktrace
      - name: Create ephemeral CI upload key
        run: |
          keytool -genkeypair \
            -storetype JKS \
            -keystore "$RUNNER_TEMP/sreadya-ci-upload.jks" \
            -storepass sreadya-ci-store-pass \
            -keypass sreadya-ci-key-pass \
            -alias sreadya-ci-upload \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=Sreadya CI, OU=Verification, O=Sreadya, C=FI"
      - name: Verify production-signing path with ephemeral key
        env:
          SREADYA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sreadya-ci-upload.jks
          SREADYA_ANDROID_KEYSTORE_PASSWORD: sreadya-ci-store-pass
          SREADYA_ANDROID_KEY_ALIAS: sreadya-ci-upload
          SREADYA_ANDROID_KEY_PASSWORD: sreadya-ci-key-pass
        run: python3 tool/configure_android_release.py --require-signing
      - name: Build signed Android release AAB and APK for verification only
        env:
          SREADYA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sreadya-ci-upload.jks
          SREADYA_ANDROID_KEYSTORE_PASSWORD: sreadya-ci-store-pass
          SREADYA_ANDROID_KEY_ALIAS: sreadya-ci-upload
          SREADYA_ANDROID_KEY_PASSWORD: sreadya-ci-key-pass
        run: |
          flutter build appbundle --release
          flutter build apk --release
      - name: Verify Android signatures and package artifacts
        env:
          SREADYA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sreadya-ci-upload.jks
          SREADYA_ANDROID_KEYSTORE_PASSWORD: sreadya-ci-store-pass
          SREADYA_ANDROID_KEY_ALIAS: sreadya-ci-upload
        run: |
          python3 tool/verify_android_signatures.py \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --apk build/app/outputs/flutter-apk/app-release.apk
      - name: Remove ephemeral Android CI signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sreadya-ci-upload.jks"

  android-family-preview-verification:
    runs-on: ubuntu-latest
    needs: flutter-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate Android host from the same Sreadya source
        run: flutter create --platforms=android --org com.sreadya.health .
      - name: Install the complete Sreadya Android native capability set
        run: |
          python3 tool/configure_platforms.py android
          python3 tool/configure_platforms.py android --check
          python3 tool/configure_android_tests.py
          python3 tool/configure_android_tests.py --check
      - name: Change only the family-preview application identity
        run: |
          python3 tool/configure_android_preview.py
          python3 tool/configure_android_preview.py --check
          grep -F 'applicationId = "com.sreadya.health.sreadya.preview"' android/app/build.gradle.kts
          grep -F 'namespace = "com.sreadya.health.sreadya"' android/app/build.gradle.kts
          grep -F 'android.permission.health.READ_MENSTRUATION' android/app/src/main/AndroidManifest.xml
      - name: Enforce the same API and signing policy as production
        run: |
          python3 tool/configure_android_release.py
          python3 tool/configure_android_release.py --check
      - name: Run Android Kotlin release unit tests
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest --stacktrace
      - name: Create isolated ephemeral family-preview key
        run: |
          keytool -genkeypair \
            -storetype JKS \
            -keystore "$RUNNER_TEMP/sreadya-preview-ci-upload.jks" \
            -storepass sreadya-preview-ci-store-pass \
            -keypass sreadya-preview-ci-key-pass \
            -alias sreadya-preview-ci-upload \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=Sreadya Family Preview CI, OU=Verification, O=Sreadya, C=FI"
      - name: Verify family-preview signing path
        env:
          SREADYA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sreadya-preview-ci-upload.jks
          SREADYA_ANDROID_KEYSTORE_PASSWORD: sreadya-preview-ci-store-pass
          SREADYA_ANDROID_KEY_ALIAS: sreadya-preview-ci-upload
          SREADYA_ANDROID_KEY_PASSWORD: sreadya-preview-ci-key-pass
        run: python3 tool/configure_android_release.py --require-signing
      - name: Build signed family-preview AAB and APK for verification only
        env:
          SREADYA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sreadya-preview-ci-upload.jks
          SREADYA_ANDROID_KEYSTORE_PASSWORD: sreadya-preview-ci-store-pass
          SREADYA_ANDROID_KEY_ALIAS: sreadya-preview-ci-upload
          SREADYA_ANDROID_KEY_PASSWORD: sreadya-preview-ci-key-pass
        run: |
          flutter build appbundle --release
          flutter build apk --release
      - name: Verify family-preview signatures
        env:
          SREADYA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sreadya-preview-ci-upload.jks
          SREADYA_ANDROID_KEYSTORE_PASSWORD: sreadya-preview-ci-store-pass
          SREADYA_ANDROID_KEY_ALIAS: sreadya-preview-ci-upload
        run: |
          python3 tool/verify_android_signatures.py \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --apk build/app/outputs/flutter-apk/app-release.apk
      - name: Remove ephemeral family-preview CI signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sreadya-preview-ci-upload.jks"

  ios-no-codesign:
    runs-on: macos-26
    needs: flutter-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate iOS host
        run: flutter create --platforms=ios --org com.sreadya.health .
      - name: Install Sreadya iOS native bridge and privacy configuration
        run: |
          python3 tool/configure_platforms.py ios
          python3 tool/configure_platforms.py ios --check
      - run: flutter build ios --release --no-codesign

  shared-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: flutter pub get
      - run: python -m pip install pytest
      - name: Verify Sreadya globalization contract and generated artifacts
        run: |
          python -m py_compile tool/i18n_pipeline.py tool/verify_globalization.py
          python tool/i18n_pipeline.py --check-google-baseline
          python tool/i18n_pipeline.py --check
          python tool/i18n_pipeline.py --dry-run --locales fi,ta,hi,ar,ja,sw
          python tool/verify_globalization.py --require-global-closure
      - name: Shared schema and release-structure reference checks
        run: >-
          python -m pytest -q
          verification/reference/test_shared_schemas.py
          verification/reference/test_shared_vector_shape.py
          verification/reference/test_shared_policy_contracts.py
          verification/reference/test_cross_platform_capability_registry.py
          verification/reference/test_web_release_structure.py
      - name: Flutter shared conformance vectors
        run: >-
          flutter test
          test/conformance/shared_prediction_vectors_test.dart
          test/conformance/shared_reminder_vectors_test.dart
          test/conformance/cyclevault_vectors_test.dart

  web-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Lint Web
        working-directory: web
        run: npm run lint
      - name: Strict TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Web unit and regression suite
        working-directory: web
        run: npm test -- --run
      - name: Production static export
        working-directory: web
        run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    needs: web-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Build static Web output for browser verification
        working-directory: web
        run: npm run build
      - name: Install target browser engines
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser navigation, accessibility and PWA proof
        working-directory: web
        run: >-
          npx playwright test
          e2e/navigation.spec.ts
          e2e/accessibility-i18n.spec.ts
          e2e/globalization-closure.spec.ts
          e2e/pwa.spec.ts
          e2e/product-completeness.spec.ts
          e2e/theme-contrast.spec.ts

  web-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Web privacy boundary scan
        run: python tool/privacy_scan.py
      - name: Scan repository for committed credentials
        run: python tool/secret_scan.py
      - name: Audit Web dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Generate Web CycloneDX SBOM
        working-directory: web
        run: |
          mkdir -p ../build/security
          npm sbom --sbom-format cyclonedx > ../build/security/sreadya-web-cyclonedx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sreadya-web-security-evidence
          path: |
            build/security/sreadya-web-cyclonedx.json
            web/package-lock.json
          retention-days: 30

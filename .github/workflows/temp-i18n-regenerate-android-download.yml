name: Temporary branch-local i18n regeneration

on:
  push:
    branches:
      - release/android-apk-website-download
    paths:
      - shared/i18n/source/en.json
      - .github/workflows/temp-i18n-regenerate-android-download.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.repository == 'Girish2052003/sreadya-womens-health' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: release/android-apk-website-download
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Regenerate deterministic Sreadya i18n artifacts
        run: |
          python tool/i18n_pipeline.py --write
          python tool/i18n_pipeline.py --check
      - name: Commit generated artifacts if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- shared/i18n/generated web/public/i18n web/src/i18n/source.generated.ts web/src/i18n/translation-manifest.generated.ts; then
            echo "No generated i18n changes."
            exit 0
          fi
          git config user.name "sreadya-i18n-bot"
          git config user.email "sreadya-i18n-bot@users.noreply.github.com"
          git add shared/i18n/generated web/public/i18n web/src/i18n/source.generated.ts web/src/i18n/translation-manifest.generated.ts
          git commit -m "chore(i18n): regenerate Android release labels"
          git push origin HEAD:release/android-apk-website-download

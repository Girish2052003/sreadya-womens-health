name: Integration Go Security Diagnostic

# Temporary diagnostic only; remove before merge.
on:
  push:
    branches:
      - integration/main-through-task23
    paths:
      - '.github/workflows/integration-go-security-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-security-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: sync_service/go.sum
      - name: Confirm Go toolchain
        run: go version
      - name: Resolve minimal fixed Go dependency set
        working-directory: sync_service
        run: |
          go get golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0
          go mod tidy
      - name: Verify sync service after dependency update
        working-directory: sync_service
        run: |
          go test ./...
          go vet ./...
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Reachability-aware Go vulnerability scan
        run: |
          (cd sync_service && govulncheck ./...)
          (cd verification/reference/task19_go && govulncheck ./...)
      - name: OSV scan non-Go locked dependencies
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.3 \
            scan source \
            -L /src/pubspec.lock \
            -L /src/web/package-lock.json
      - name: Print exact dependency diff
        run: |
          git --no-pager diff -- sync_service/go.mod sync_service/go.sum
          git diff --check -- sync_service/go.mod sync_service/go.sum

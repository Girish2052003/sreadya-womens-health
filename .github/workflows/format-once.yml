name: Canonical Dart Format Once

on:
  push:
    branches: [feat/worldwide-v1]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[dartfmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldwide-v1
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Canonicalize Dart sources
        run: dart format lib test tool
      - name: Commit canonical formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- lib test tool; then
            echo "Already canonically formatted."
            exit 0
          fi
          git config user.name "Sreva CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tool
          git commit -m "style: canonicalize Dart formatting [dartfmt]"
          git push origin HEAD:feat/worldwide-v1

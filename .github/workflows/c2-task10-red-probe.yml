name: C2 Task 10 RED Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  account-free-core-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Run Task 10 account-free unit probes directly
        working-directory: web
        run: npm test -- --run src/features/onboarding/private-onboarding.test.ts src/features/cycle/period-actions.test.ts
      - name: Build static Web client for Task 10 browser probe
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Task 10 real-browser offline RED
        working-directory: web
        run: npx playwright test e2e/account-free-core.spec.ts --project=chromium

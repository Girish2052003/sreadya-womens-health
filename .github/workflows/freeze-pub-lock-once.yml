name: Freeze Sreva dependency lock once

on:
  push:
    branches: [feat/worldwide-v1]
    paths:
      - '.github/workflows/freeze-pub-lock-once.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldwide-v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve and freeze exact Dart/Flutter dependency graph
        run: |
          flutter pub get
          test -s pubspec.lock
          git diff --check -- pubspec.lock
      - name: Commit only lockfile and self-remove
        run: |
          rm .github/workflows/freeze-pub-lock-once.yml
          git config user.name 'Sreva CI'
          git config user.email '132274277+Girish2052003@users.noreply.github.com'
          git add pubspec.lock .github/workflows/freeze-pub-lock-once.yml
          git diff --cached --check
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/freeze-pub-lock-once.yml pubspec.lock "
          git commit -m 'build: freeze Flutter dependency graph for v1'
          git push origin HEAD:feat/worldwide-v1

name: C2 Task 18 Live Acceptance Preflight

on:
  push:
    branches:
      - feat/task18-wife-pwa-acceptance
    paths:
      - 'web/e2e/task18-live-acceptance.spec.ts'
      - 'web/playwright.live.config.ts'
      - '.github/workflows/c2-task18-live-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c2-task18-live-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-desktop-acceptance-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Install Chromium for production acceptance preflight
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify deployed Sreadya PWA account-free flow
        working-directory: web
        env:
          SREADYA_LIVE_BASE_URL: https://girish2052003.github.io/sreadya-womens-health/
        run: npx playwright test e2e/task18-live-acceptance.spec.ts --config=playwright.live.config.ts --project=chromium

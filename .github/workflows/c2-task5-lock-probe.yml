name: C2 Task 5 Lock Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Generate exact npm lockfile without lifecycle scripts
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts
      - name: Emit compressed lockfile for repository writeback
        run: |
          echo 'SREVA_LOCK_GZIP_BASE64_BEGIN'
          gzip -c web/package-lock.json | base64 -w0
          echo
          echo 'SREVA_LOCK_GZIP_BASE64_END'

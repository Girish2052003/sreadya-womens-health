name: C2 Task 5 Lock Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Girish2052003'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Generate exact npm lockfile without lifecycle scripts
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lock generation changed no source files
        run: |
          git diff --exit-code -- web/package.json
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo 'Lockfile already canonical.'
            exit 0
          fi
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 1
          printf '%s\n' "$changed" | grep -Eq '^\?\? web/package-lock\.json$|^ M web/package-lock\.json$'
      - name: Commit generated lockfile to the C2 feature branch
        run: |
          if git diff --quiet -- web/package-lock.json && git ls-files --error-unmatch web/package-lock.json >/dev/null 2>&1; then
            echo 'No lockfile change to commit.'
            exit 0
          fi
          git config user.name 'Sreva C2 Lock Bot'
          git config user.email '132274277+Girish2052003@users.noreply.github.com'
          git add web/package-lock.json
          git commit -m 'web: lock Task 5 dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

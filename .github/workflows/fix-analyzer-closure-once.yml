name: Fix Sreva analyzer closure once

on:
  push:
    branches: [feat/worldwide-v1]
    paths:
      - '.github/workflows/fix-analyzer-closure-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldwide-v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply exactly the six analyzer fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'lib/core/database/health_vault.dart': [
                  ("          if (rows.isNotEmpty)\n            currentVersion = int.parse(rows.first['value'] as String);",
                   "          if (rows.isNotEmpty) {\n            currentVersion = int.parse(rows.first['value'] as String);\n          }"),
              ],
              'lib/features/calendar/presentation/calendar_screen.dart': [
                  ("    if (yes == true)\n      await ref.read(healthActionsProvider).deletePeriod(period.id);",
                   "    if (yes == true) {\n      await ref.read(healthActionsProvider).deletePeriod(period.id);\n    }"),
              ],
              'lib/features/logging/presentation/log_screen.dart': [
                  ("    final prefs =\n        ref.watch(appPreferencesProvider).valueOrNull ?? const AppPreferences();",
                   "    final prefs =\n        ref.watch(appPreferencesProvider).asData?.value ?? const AppPreferences();"),
                  ("    if (yes == true)\n      await ref.read(healthActionsProvider).deleteObservation(item.id);",
                   "    if (yes == true) {\n      await ref.read(healthActionsProvider).deleteObservation(item.id);\n    }"),
              ],
              'lib/features/reminders/presentation/reminders_screen.dart': [
                  ("    final appPreferences =\n        ref.watch(appPreferencesProvider).valueOrNull ?? const AppPreferences();",
                   "    final appPreferences =\n        ref.watch(appPreferencesProvider).asData?.value ?? const AppPreferences();"),
              ],
              'lib/features/onboarding/presentation/onboarding_screen.dart': [
                  ("import '../../reminders/data/reminder_preferences.dart';\n", ""),
              ],
          }

          for path_str, edits in replacements.items():
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly 1 occurrence, found {count}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
      - name: Canonical format repaired Dart files
        run: >-
          dart format
          lib/core/database/health_vault.dart
          lib/features/calendar/presentation/calendar_screen.dart
          lib/features/logging/presentation/log_screen.dart
          lib/features/reminders/presentation/reminders_screen.dart
          lib/features/onboarding/presentation/onboarding_screen.dart
      - name: Remove one-shot workflow and commit repair
        run: |
          rm .github/workflows/fix-analyzer-closure-once.yml
          git config user.name 'Sreva CI'
          git config user.email '132274277+Girish2052003@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close analyzer findings for worldwide v1'
          git push origin HEAD:feat/worldwide-v1

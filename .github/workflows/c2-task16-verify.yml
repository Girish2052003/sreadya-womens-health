name: C2 Task 16 Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-diagnostics-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Strict TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Health-payload-free diagnostics and safe recovery policy
        working-directory: web
        run: >-
          npm test -- --run
          src/diagnostics/diagnostic-report.test.ts
          src/recovery/safe-mode.test.ts
          src/components/errors/SafeMode.test.tsx
      - name: Full Web regression suite
        working-directory: web
        run: npm test -- --run
      - name: Production static export
        working-directory: web
        run: npm run build

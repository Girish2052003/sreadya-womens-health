name: One-shot Pages asset diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-asset-diagnostic.yml'

permissions:
  contents: read

jobs:
  verify-live-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live HTML, CSS, JS and manifest
        shell: bash
        run: |
          set -euo pipefail
          base="https://girish2052003.github.io/sreadya-womens-health"
          html="$(curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors "$base/")"

          css_path="$(printf '%s' "$html" | grep -oE 'href="[^"]+\.css"' | head -n1 | cut -d'"' -f2)"
          js_path="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | head -n1 | cut -d'"' -f2)"

          test -n "$css_path"
          test -n "$js_path"

          echo "CSS path: $css_path"
          echo "JS path: $js_path"

          curl -fsSL -D /tmp/css.headers "$base${css_path#/sreadya-womens-health}" -o /tmp/site.css
          curl -fsSL -D /tmp/js.headers "$base${js_path#/sreadya-womens-health}" -o /tmp/site.js
          curl -fsSL -D /tmp/manifest.headers "$base/manifest.webmanifest" -o /tmp/manifest.json

          css_bytes="$(wc -c </tmp/site.css)"
          js_bytes="$(wc -c </tmp/site.js)"
          echo "CSS bytes: $css_bytes"
          echo "JS bytes: $js_bytes"

          test "$css_bytes" -gt 10000
          test "$js_bytes" -gt 1000

          grep -qi '^content-type:.*text/css' /tmp/css.headers
          grep -qi '^content-type:.*javascript' /tmp/js.headers

          echo "Live HTML, stylesheet, JavaScript and manifest are all reachable."

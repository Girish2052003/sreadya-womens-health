name: One-shot branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-branch-cleanup
  cancel-in-progress: false

jobs:
  delete-verified-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Safety-check repository state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          test "$default_branch" = "main"

          # Each cleanup target is tied to the exact reviewed branch head.
          declare -A expected_heads=(
            ["feat/sreadya-globalization-v1"]="d1b68d5171700c16caa74b83db94150f7045b9d1"
            ["fix/sreadya-complete-locales"]="07c18afec1a2b0ac64e52ac50a4d2e340bde5316"
            ["fix/task18-live-sentinel-collision"]="3bc0b5ec294911a2622198d7febde5389a282f34"
          )

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            if [[ -z "${expected_heads[$branch]+x}" ]]; then
              echo "::error::Unexpected non-main branch found: $branch"
              exit 1
            fi

            actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual_sha" != "${expected_heads[$branch]}" ]]; then
              echo "::error::Branch $branch moved: expected ${expected_heads[$branch]}, got $actual_sha"
              exit 1
            fi
          done

          # Verify the three merge results are ancestors of the current main.
          git merge-base --is-ancestor 2a658b869442908d665bd9205dd55387fc2462fb HEAD
          git merge-base --is-ancestor adc919887dcd73244d208cb36c4ce11e56931f75 HEAD
          git merge-base --is-ancestor 1419759f85a7aec43a83b791c789dbedf78e605e HEAD

          # Verify GitHub still records the associated PRs as merged.
          for pr in 23 24 25; do
            merged_at="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$pr" --jq '.merged_at // ""')"
            if [[ -z "$merged_at" ]]; then
              echo "::error::PR #$pr is not recorded as merged."
              exit 1
            fi
          done

      - name: Delete verified non-main branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete \
            feat/sreadya-globalization-v1 \
            fix/sreadya-complete-locales \
            fix/task18-live-sentinel-collision

      - name: Verify only main remains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t remaining < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )
          printf 'Remaining branches:\n'
          printf ' - %s\n' "${remaining[@]}"
          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != "main" ]]; then
            echo "::error::Branch cleanup did not end with main as the sole branch."
            exit 1
          fi

              '''    <uses-permission android:name="android.permission.health.READ_SEXUAL_ACTIVITY" />\n''',
              '''    <uses-permission android:name="android.permission.health.READ_SEXUAL_ACTIVITY" />\n    <uses-permission android:name="android.permission.health.WRITE_SEXUAL_ACTIVITY" />\n    <uses-permission android:name="android.permission.health.READ_HEALTH_DATA_HISTORY" />\n''',
          )
          replace_once(
              'tool/configure_platforms.py',
              '''            'android.permission.health.READ_SEXUAL_ACTIVITY',\n            '.SrevaBootReceiver',\n''',
              '''            'android.permission.health.READ_SEXUAL_ACTIVITY',\n            'android.permission.health.WRITE_SEXUAL_ACTIVITY',\n            'android.permission.health.READ_HEALTH_DATA_HISTORY',\n            '.SrevaBootReceiver',\n''',
          )

          # Health platform Dart contract exposes history feature/grant state.
          replace_once(
              'lib/features/health_integration/data/health_platform.dart',
              '''    required this.platformName,\n    required this.supportedCategories,\n  });\n  final bool available;\n  final bool authorizationRequested;\n  final String platformName;\n  final Set<HealthDataCategory> supportedCategories;\n''',
              '''    required this.platformName,\n    required this.supportedCategories,\n    required this.historicalReadAvailable,\n    required this.historicalReadGranted,\n  });\n  final bool available;\n  final bool authorizationRequested;\n  final String platformName;\n  final Set<HealthDataCategory> supportedCategories;\n  final bool historicalReadAvailable;\n  final bool historicalReadGranted;\n''',
          )
          replace_once(
              'lib/features/health_integration/data/health_platform.dart',
              '''        supportedCategories:\n            ((map?['supportedCategories'] as List<Object?>?) ??\n                    const <Object?>[])\n                .map((value) => value.toString())\n                .map(_categoryByName)\n                .whereType<HealthDataCategory>()\n                .toSet(),\n      );\n''',
              '''        supportedCategories:\n            ((map?['supportedCategories'] as List<Object?>?) ??\n                    const <Object?>[])\n                .map((value) => value.toString())\n                .map(_categoryByName)\n                .whereType<HealthDataCategory>()\n                .toSet(),\n        historicalReadAvailable: map?['historicalReadAvailable'] == true,\n        historicalReadGranted: map?['historicalReadGranted'] == true,\n      );\n''',

              '''        "dailyReminderKeepsEightAmAcrossAutumnDstChange",\n        "oneShotReminderPreservesStoredLocalCalendarFields",\n        "dailyReminderKeepsEightAmInEveryAvailableTimeZone",\n        "oneShotReminderKeepsWallClockAfterTimeZoneChange",\n''',
          )

          # Android manifest and native-host validation: long history + sexual-activity write.
          replace_once(

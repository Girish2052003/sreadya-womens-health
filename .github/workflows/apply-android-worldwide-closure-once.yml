name: Apply Android worldwide closure patch once

on:
  push:
    branches: [feat/worldwide-v1]
    paths:
      - '.github/workflows/apply-android-worldwide-closure-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldwide-v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply audited Android worldwide closure implementation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # CycleVault: expose byte-level core so crypto/atomic restore can be exercised directly.
          path = Path('lib/features/backup/data/cycle_vault_service.dart')
          text = path.read_text(encoding='utf-8')
          start = text.index('  Future<String> exportToFile(String passphrase) async {')
          end = text.index('  bool _validateStaged(_StagedRestore staged) {')
          replacement = r'''  Future<List<int>> exportBytes(String passphrase) async {
            if (passphrase.length < 12) {
              throw ArgumentError(
                'CycleVault recovery passphrase must be at least 12 characters.',
              );
            }
            final periods = await _repository.listPeriods();
            final observations = await _repository.listObservations();
            final payload = utf8.encode(
              jsonEncode({
                'periods': periods.map(_periodToJson).toList(),
                'observations': observations.map(_observationToJson).toList(),
              }),
            );

            final salt = _randomBytes(16);
            final key = await _kdf.deriveKeyFromPassword(
              password: passphrase,
              nonce: salt,
            );
            final manifest = {
              'format': format,
              'formatVersion': formatVersion,
              'createdAtUtc': DateTime.now().toUtc().toIso8601String(),
              'appVersion': AppVersions.app,
              'databaseSchema': AppVersions.databaseSchema,
              'predictionEngine': AppVersions.predictionEngine,
              'kdf': 'argon2id-m19MiB-t2-p1',
              'cipher': 'aes-256-gcm',
            };
            final aad = utf8.encode(jsonEncode(manifest));
            final box = await _cipher.encrypt(payload, secretKey: key, aad: aad);
            final outer = {
              'manifest': manifest,
              'salt': base64Encode(salt),
              'sealedPayload': base64Encode(box.concatenation()),
            };
            return utf8.encode(jsonEncode(outer));
          }

          Future<String> exportToFile(String passphrase) async {
            final bytes = await exportBytes(passphrase);
            final directory = await getTemporaryDirectory();
            final name =
                'sreva-${DateTime.now().toUtc().toIso8601String().replaceAll(':', '-')}.cyclevault';
            final file = File(p.join(directory.path, name));
            await file.writeAsBytes(bytes, flush: true);
            return file.path;
          }

          Future<CycleVaultRestoreResult> restoreFromFile(
            String path,
            String passphrase, {
            CycleVaultRestoreMode mode = CycleVaultRestoreMode.replaceAll,
          }) async {
            return restoreBytes(
              await File(path).readAsBytes(),
              passphrase,
              mode: mode,
            );
          }

          Future<CycleVaultRestoreResult> restoreBytes(
            List<int> bytes,
            String passphrase, {
            CycleVaultRestoreMode mode = CycleVaultRestoreMode.replaceAll,
          }) async {
            final decoded = jsonDecode(utf8.decode(bytes));
            if (decoded is! Map) {
              throw const FormatException('Malformed CycleVault container.');
            }
            final outer = Map<String, dynamic>.from(decoded);
            final rawManifest = outer['manifest'];
            if (rawManifest is! Map) {
              throw const FormatException('CycleVault manifest is missing.');
            }
            final manifest = Map<String, dynamic>.from(rawManifest);
            if (manifest['format'] != format ||
                manifest['formatVersion'] != formatVersion) {
              throw const FormatException('Unsupported CycleVault format.');
            }
            final saltValue = outer['salt'];
            final sealedValue = outer['sealedPayload'];
            if (saltValue is! String || sealedValue is! String) {
              throw const FormatException('CycleVault encrypted payload is missing.');
            }
            final salt = base64Decode(saltValue);
            final sealed = base64Decode(sealedValue);
            final key = await _kdf.deriveKeyFromPassword(
              password: passphrase,
              nonce: salt,
            );
            final box = SecretBox.fromConcatenation(
              sealed,
              nonceLength: _cipher.nonceLength,
              macLength: _cipher.macAlgorithm.macLength,
              copy: false,
            );
            final clear = await _cipher.decrypt(
              box,
              secretKey: key,
              aad: utf8.encode(jsonEncode(manifest)),
            );
            final decodedPayload = jsonDecode(utf8.decode(clear));
            if (decodedPayload is! Map) {
              throw const FormatException('Malformed CycleVault payload.');
            }
            final payload = Map<String, dynamic>.from(decodedPayload);
            final periods = (payload['periods'] as List<dynamic>? ?? const [])
                .map(
                  (value) =>
                      _periodFromJson(Map<String, dynamic>.from(value as Map)),
                )
                .toList(growable: false);
            final observations =
                (payload['observations'] as List<dynamic>? ?? const [])
                    .map(
                      (value) => _observationFromJson(
                        Map<String, dynamic>.from(value as Map),
                      ),
                    )
                    .toList(growable: false);
            final staged = _StagedRestore(periods, observations);

            if (mode == CycleVaultRestoreMode.replaceAll) {
              final coordinator = RestoreTransactionCoordinator<_StagedRestore>();
              await coordinator.commit(
                live: _StagedRestore(
                  await _repository.listPeriods(),
                  await _repository.listObservations(),
                ),
                staged: staged,
                validate: (value) async => _validateStaged(value),
                replaceLive: (value) => _repository.replaceAll(
                  periods: value.periods,
                  observations: value.observations,
                ),
              );
              return CycleVaultRestoreResult(
                periods: periods.length,
                observations: observations.length,
                mode: mode,
              );
            }

            if (!_validateStaged(staged)) {
              throw StateError('CycleVault restore failed domain validation.');
            }
            final existingPeriods = await _repository.listPeriods();
            var restoredPeriods = 0;
            for (final period in periods) {
              final duplicate = existingPeriods.any(
                (current) =>
                    _sameDay(current.start, period.start) &&
                    ((current.end == null && period.end == null) ||
                        (current.end != null &&
                            period.end != null &&
                            _sameDay(current.end!, period.end!))),
              );
              if (duplicate) continue;
              await _repository.savePeriod(period);
              existingPeriods.add(period);
              restoredPeriods++;
            }
            final existingObservations = await _repository.listObservations();
            final existingIds = existingObservations
                .map((value) => value.id)
                .toSet();
            var restoredObservations = 0;
            for (final observation in observations) {
              if (!existingIds.add(observation.id)) continue;
              await _repository.saveObservation(observation);
              restoredObservations++;
            }
            return CycleVaultRestoreResult(
              periods: restoredPeriods,
              observations: restoredObservations,
              mode: mode,
            );
          }

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          # Prediction calibration metrics.
          replace_once(

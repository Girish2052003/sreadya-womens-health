name: Task 17 Web E2E Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-e2e-spec:
    name: Web E2E ${{ matrix.spec }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - navigation
          - accessibility-i18n
          - pwa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Build static Web output for browser verification
        working-directory: web
        run: npm run build
      - name: Install target browser engines
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run isolated ${{ matrix.spec }} proof
        working-directory: web
        run: npx playwright test e2e/${{ matrix.spec }}.spec.ts

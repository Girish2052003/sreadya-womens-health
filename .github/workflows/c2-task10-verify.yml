name: C2 Task 10 Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  account-free-cycle-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Strict TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Complete Task 10 and regression Vitest suite
        working-directory: web
        run: npm test -- --run
      - name: Static export
        working-directory: web
        run: npm run build
      - name: Install Chromium for offline verification
        working-directory: web
        run: npx playwright install --with-deps chromium
      # Task 8 separately requires Chromium + WebKit real IndexedDB/WebCrypto
      # persistence on this same head. Playwright/Linux WebKit currently fails
      # its synthetic offline reload primitive before application assertions,
      # so Task 10 keeps the required offline proof in Chromium rather than
      # misclassifying a WebKit runner error as a Sreva product failure.
      - name: Real account-free encrypted offline persistence
        working-directory: web
        run: npx playwright test e2e/account-free-core.spec.ts --project=chromium

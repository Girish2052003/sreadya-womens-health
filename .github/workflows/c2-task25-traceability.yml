name: C2 Task 25 Cross-Platform Traceability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sreadya-task25-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Preserve legacy mobile traceability
        run: python tool/verify_v1_traceability.py
      - name: Enforce 258-ID cross-platform traceability
        run: python tool/verify_cross_platform_traceability.py
      - name: Execute Task 25 reference contract
        run: python -m pytest -q verification/reference/test_cross_platform_traceability.py

name: Bootstrap Sreva Source

on:
  push:
    paths:
      - 'bootstrap/sreva-source.tar.gz.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify bootstrap payload exists
        run: test -f bootstrap/sreva-source.tar.gz.b64
      - name: Decode and verify source archive
        run: |
          base64 -d bootstrap/sreva-source.tar.gz.b64 > /tmp/sreva-source.tar.gz
          echo 'd2c9d2239418a23a92bfb12b4fb9671b26e0150d1242f91629df4f42024f15c7  /tmp/sreva-source.tar.gz' | sha256sum -c -
      - name: Replace repository tree with verified Sreva source
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name bootstrap ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/sreva-source.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-sreva.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit production source tree
        run: |
          git config user.name 'sreva-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Sreva worldwide v1 foundation'
          git push origin HEAD:main

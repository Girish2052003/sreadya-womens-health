name: Sreadya Android production release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release/android-production.json

permissions:
  contents: read

concurrency:
  group: sreadya-android-production
  cancel-in-progress: false

jobs:
  production-release:
    name: Verify and build Play-ready Android release
    if: ${{ github.repository == 'Girish2052003/sreadya-womens-health' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: android-production
    steps:
      - name: Set isolated runner signing path
        run: echo "SREADYA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sreadya-upload.jks" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require production signing and artifact-encryption secrets
        env:
          KEYSTORE_B64: ${{ secrets.SREADYA_ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SREADYA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SREADYA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SREADYA_ANDROID_KEY_PASSWORD }}
          ARTIFACT_PASSWORD: ${{ secrets.SREADYA_PRODUCTION_ARTIFACT_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$ARTIFACT_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SREADYA_ANDROID_KEYSTORE_PATH"
          chmod 600 "$SREADYA_ANDROID_KEYSTORE_PATH"
          test -s "$SREADYA_ANDROID_KEYSTORE_PATH"
      - run: flutter pub get
      - name: Verify Android release publication manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("release/android-production.json").read_text(encoding="utf-8"))
          version = next(
              line.split(":", 1)[1].strip()
              for line in Path("pubspec.yaml").read_text(encoding="utf-8").splitlines()
              if line.startswith("version:")
          )
          assert manifest["schema_version"] == 1
          assert manifest["channel"] == "production"
          assert manifest["publication"] == "github-release"
          assert manifest["version"] == version, (manifest["version"], version)
          assert manifest["release_tag"] == f"android-v{version}"
          assert manifest["source_apk"] == f"sreadya-{version}-production.apk"
          assert manifest["public_apk_asset"] == "sreadya-android.apk"
          print(f"Android production publication manifest verified for {version}")
          PY
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: python -m py_compile tool/configure_platforms.py tool/configure_android_tests.py tool/configure_android_release.py tool/verify_android_signatures.py tool/verify_v1_traceability.py tool/release_backlog_scan.py tool/privacy_scan.py tool/secret_scan.py tool/generate_sbom.py
      - run: python -m pip install pytest
      - run: python -m pytest -q verification/reference
      - name: Verify exhaustive worldwide-v1 traceability
        run: python tool/verify_v1_traceability.py
      - name: Fail on release backlog markers
        run: python tool/release_backlog_scan.py
      - run: python tool/privacy_scan.py
      - name: Scan repository for committed credentials
        run: python tool/secret_scan.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: sync_service/go.sum
      - name: Scan Go modules with the required toolchain
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          (cd sync_service && govulncheck ./...)
          (cd verification/reference/task19_go && govulncheck ./...)
      - name: Dependency vulnerability scan (OSV, Dart and Web locks)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.3 \
            scan source -L /src/pubspec.lock -L /src/web/package-lock.json
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p build/security
          dart pub deps --json > build/security/pub-deps.json
          python tool/generate_sbom.py build/security/pub-deps.json build/security/sreadya-cyclonedx.json
      - name: Generate Android host
        run: flutter create --platforms=android --org com.sreadya.health .
      - name: Configure Sreadya Android host
        run: |
          python3 tool/configure_platforms.py android
          python3 tool/configure_platforms.py android --check
          python3 tool/configure_android_tests.py
          python3 tool/configure_android_tests.py --check
      - name: Configure production signing and Play target
        env:
          SREADYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SREADYA_ANDROID_KEYSTORE_PASSWORD }}
          SREADYA_ANDROID_KEY_ALIAS: ${{ secrets.SREADYA_ANDROID_KEY_ALIAS }}
          SREADYA_ANDROID_KEY_PASSWORD: ${{ secrets.SREADYA_ANDROID_KEY_PASSWORD }}
        run: |
          python3 tool/configure_android_release.py --require-signing
          python3 tool/configure_android_release.py --check --require-signing
      - name: Run Android Kotlin release unit tests
        working-directory: android
        env:
          SREADYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SREADYA_ANDROID_KEYSTORE_PASSWORD }}
          SREADYA_ANDROID_KEY_ALIAS: ${{ secrets.SREADYA_ANDROID_KEY_ALIAS }}
          SREADYA_ANDROID_KEY_PASSWORD: ${{ secrets.SREADYA_ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --stop || true
          ./gradlew --no-daemon :app:testReleaseUnitTest --stacktrace
      - name: Build Play-ready AAB and production-signed APK
        env:
          SREADYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SREADYA_ANDROID_KEYSTORE_PASSWORD }}
          SREADYA_ANDROID_KEY_ALIAS: ${{ secrets.SREADYA_ANDROID_KEY_ALIAS }}
          SREADYA_ANDROID_KEY_PASSWORD: ${{ secrets.SREADYA_ANDROID_KEY_PASSWORD }}
        run: |
          (cd android && ./gradlew --stop) || true
          flutter build appbundle --release
          flutter build apk --release
      - name: Verify production signatures
        env:
          SREADYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SREADYA_ANDROID_KEYSTORE_PASSWORD }}
          SREADYA_ANDROID_KEY_ALIAS: ${{ secrets.SREADYA_ANDROID_KEY_ALIAS }}
        run: |
          python3 tool/verify_android_signatures.py \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --apk build/app/outputs/flutter-apk/app-release.apk
      - name: Create release checksums
        run: |
          mkdir -p build/release
          cp build/app/outputs/bundle/release/app-release.aab build/release/sreadya-1.0.0+1-play.aab
          cp build/app/outputs/flutter-apk/app-release.apk build/release/sreadya-1.0.0+1-production.apk
          sha256sum build/release/sreadya-1.0.0+1-play.aab build/release/sreadya-1.0.0+1-production.apk > build/release/SHA256SUMS.txt
      - name: Encrypt production release payload for public Actions storage
        env:
          ARTIFACT_PASSWORD: ${{ secrets.SREADYA_PRODUCTION_ARTIFACT_PASSWORD }}
        run: |
          test -n "$ARTIFACT_PASSWORD"
          mkdir -p build/private-release-payload build/public-artifacts
          cp build/release/sreadya-1.0.0+1-play.aab build/private-release-payload/
          cp build/release/sreadya-1.0.0+1-production.apk build/private-release-payload/
          cp build/release/SHA256SUMS.txt build/private-release-payload/
          cp build/security/sreadya-cyclonedx.json build/private-release-payload/
          cp pubspec.lock build/private-release-payload/
          tar -C build/private-release-payload -czf "$RUNNER_TEMP/sreadya-1.0.0+1-production-release.tar.gz" .
          printf '%s' "$ARTIFACT_PASSWORD" | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/sreadya-1.0.0+1-production-release.tar.gz" \
            -out build/public-artifacts/sreadya-1.0.0+1-production-release.tar.gz.enc \
            -pass stdin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sreadya-android-1.0.0-production-encrypted
          path: build/public-artifacts/sreadya-1.0.0+1-production-release.tar.gz.enc
          retention-days: 30
      - name: Remove production signing and plaintext release material
        if: always()
        run: |
          rm -f "$SREADYA_ANDROID_KEYSTORE_PATH"
          rm -f "$RUNNER_TEMP/sreadya-1.0.0+1-production-release.tar.gz"
          rm -rf build/private-release-payload build/release

  publish-public-apk:
    name: Publish verified Android APK
    needs: production-release
    if: ${{ github.repository == 'Girish2052003/sreadya-womens-health' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: android-production
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sreadya-android-1.0.0-production-encrypted
          path: build/release-download
      - name: Decrypt reviewed production payload
        env:
          ARTIFACT_PASSWORD: ${{ secrets.SREADYA_PRODUCTION_ARTIFACT_PASSWORD }}
        run: |
          test -n "$ARTIFACT_PASSWORD"
          mkdir -p "$RUNNER_TEMP/sreadya-public-apk"
          printf '%s' "$ARTIFACT_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in build/release-download/sreadya-1.0.0+1-production-release.tar.gz.enc \
            -out "$RUNNER_TEMP/sreadya-production-release.tar.gz" \
            -pass stdin
          tar -C "$RUNNER_TEMP/sreadya-public-apk" -xzf "$RUNNER_TEMP/sreadya-production-release.tar.gz"
      - name: Re-verify checksums and prepare public APK
        run: |
          cd "$RUNNER_TEMP/sreadya-public-apk"
          sha256sum -c SHA256SUMS.txt
          test -s sreadya-1.0.0+1-production.apk
          cp sreadya-1.0.0+1-production.apk sreadya-android.apk
          sha256sum sreadya-android.apk > sreadya-android.apk.sha256
      - name: Create or update public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python3 -c 'import json; print(json.load(open("release/android-production.json"))["release_tag"])')"
          version="$(python3 -c 'import json; print(json.load(open("release/android-production.json"))["version"])')"
          cat > "$RUNNER_TEMP/android-release-notes.md" <<EOF
          ## Sreadya Android ${version}

          This is the production-signed Sreadya Android APK built from the canonical `main` branch after the complete release verification pipeline passed.

          - Package: `com.sreadya.health.sreadya`
          - Version: `${version}`
          - Source commit: `${GITHUB_SHA}`
          - User-installable asset: `sreadya-android.apk`
          - Integrity file: `sreadya-android.apk.sha256`

          The Android App Bundle remains inside the encrypted maintainer release payload and is not published as a public download.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$RUNNER_TEMP/sreadya-public-apk/sreadya-android.apk" \
              "$RUNNER_TEMP/sreadya-public-apk/sreadya-android.apk.sha256" \
              "$RUNNER_TEMP/sreadya-public-apk/sreadya-cyclonedx.json" \
              --clobber
            gh release edit "$tag" --title "Sreadya Android ${version}" --notes-file "$RUNNER_TEMP/android-release-notes.md"
          else
            gh release create "$tag" \
              "$RUNNER_TEMP/sreadya-public-apk/sreadya-android.apk" \
              "$RUNNER_TEMP/sreadya-public-apk/sreadya-android.apk.sha256" \
              "$RUNNER_TEMP/sreadya-public-apk/sreadya-cyclonedx.json" \
              --target "$GITHUB_SHA" \
              --title "Sreadya Android ${version}" \
              --notes-file "$RUNNER_TEMP/android-release-notes.md"
          fi
      - name: Remove decrypted public-release staging material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sreadya-production-release.tar.gz"
          rm -f "$RUNNER_TEMP/android-release-notes.md"
          rm -rf "$RUNNER_TEMP/sreadya-public-apk"
          rm -rf build/release-download


name: Dart Fix Sreva source

on:
  push:
    branches: [feat/worldwide-v1]
    paths:
      - '.github/workflows/dart-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldwide-v1
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart fix --apply
      - run: dart format lib test tool
      - name: Commit Dart automated fixes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test tool
          if git diff --cached --quiet; then
            echo 'No Dart fixes to commit.'
            exit 0
          fi
          git commit -m 'style: apply Dart analyzer fixes'
          git push origin HEAD:feat/worldwide-v1

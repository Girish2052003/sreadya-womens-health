name: C2 Task 22 Ciphertext Sync API

on:
  push:
    branches:
      - feat/task22-ciphertext-sync-api
    paths:
      - 'sync_service/**'
      - 'web/src/sync/**'
      - 'shared/sync/**'
      - '.github/workflows/c2-task22-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c2-task22-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify pinned Task 22 Go module lock
        working-directory: sync_service
        run: |
          go mod tidy
          git diff -- go.mod go.sum
          git diff --exit-code -- go.mod go.sum
      - name: Verify opaque ciphertext sync service
        working-directory: sync_service
        run: go test ./...
      - name: Vet opaque ciphertext sync service
        working-directory: sync_service
        run: go vet ./...

  web-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Typecheck Web sync boundary
        working-directory: web
        run: npm run typecheck
      - name: Test Web sync boundary
        working-directory: web
        run: npm test -- --run

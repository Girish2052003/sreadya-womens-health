name: Format acceptance tests once

on:
  push:
    branches: [feat/worldwide-v1]
    paths:
      - '.github/workflows/format-acceptance-tests-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldwide-v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Canonically format only new Dart acceptance tests
        run: dart format test/backup/cycle_vault_restore_test.dart test/domain/local_intent_parser_test.dart test/predictions/prediction_history_test.dart
      - name: Commit formatted tests and remove this one-shot workflow
        run: |
          rm .github/workflows/format-acceptance-tests-once.yml
          git config user.name 'Sreva CI'
          git config user.email '132274277+Girish2052003@users.noreply.github.com'
          git add test/backup/cycle_vault_restore_test.dart test/domain/local_intent_parser_test.dart test/predictions/prediction_history_test.dart .github/workflows/format-acceptance-tests-once.yml
          git diff --cached --check
          git commit -m 'test: canonically format Android closure acceptance suite'
          git push origin HEAD:feat/worldwide-v1

name: Materialize Sreva final source

on:
  push:
    branches: [feat/worldwide-v1]
    paths:
      - '.github/workflows/materialize-final-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldwide-v1
          fetch-depth: 0

      - name: Reconstruct and verify exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/final.part00 bootstrap/final.part01 bootstrap/final.part02 bootstrap/final.part03 bootstrap/final.part04 > /tmp/sreva.b64
          base64 -d /tmp/sreva.b64 > /tmp/sreva.tar.xz
          echo '2db6a1d42853b6af9a964765ed16407e4fa528a2ff5bc7d105449121afa869a3  /tmp/sreva.tar.xz' | sha256sum -c -
          # Workflow files are installed separately through the authorized GitHub connector.
          tar -xJf /tmp/sreva.tar.xz --exclude='.github/workflows/ci.yml' -C .
          rm -rf bootstrap

      - name: Commit exact Sreva application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: materialize complete pre-Apple worldwide v1 source'
          git push origin HEAD:feat/worldwide-v1

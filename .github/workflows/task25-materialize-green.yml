name: Task 25 Materialize Green Candidate

on:
  push:
    branches: [task25-formal-green]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task25-formal-green
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify committed explicit ledger is reproducible
        run: python tool/generate_cross_platform_evidence.py --check
      - name: Preserve legacy mobile traceability gate
        run: python tool/verify_v1_traceability.py
      - name: Verify explicit cross-platform ledger
        run: python tool/verify_cross_platform_traceability.py
      - name: Patch main release CI in an ephemeral workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          verifier = 'python tool/verify_cross_platform_traceability.py'
          if verifier not in text:
              anchor = (
                  '      - name: Verify exhaustive worldwide-v1 traceability\n'
                  '        run: python tool/verify_v1_traceability.py\n'
              )
              replacement = anchor + (
                  '      - name: Verify deterministic Task 25 evidence ledger\n'
                  '        run: python tool/generate_cross_platform_evidence.py --check\n'
                  '      - name: Verify explicit 258-ID cross-platform traceability\n'
                  '        run: python tool/verify_cross_platform_traceability.py\n'
              )
              if anchor not in text:
                  raise SystemExit('main CI traceability anchor changed')
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Execute frozen Task 25 RED contract against patched CI
        run: |
          python -m pip install pytest
          python -m pytest -q verification/reference/test_cross_platform_traceability.py
      - name: Emit exact patched ci.yml blob
        shell: bash
        run: |
          printf 'TASK25_CI_B64='
          base64 -w0 .github/workflows/ci.yml
          printf '\n'

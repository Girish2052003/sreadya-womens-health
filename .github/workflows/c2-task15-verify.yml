name: C2 Task 15 Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-accessibility-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify Sreadya globalization contract
        run: |
          python -m py_compile tool/i18n_pipeline.py tool/verify_globalization.py
          python tool/verify_globalization.py
          python tool/i18n_pipeline.py --check
          python tool/i18n_pipeline.py --dry-run --locales fi,ta,hi,ar,ja,sw
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Strict TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Full Web regression and Task 15 unit suite
        working-directory: web
        run: npm test -- --run
      - name: Production static export
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Keyboard, reflow, preferences, RTL and WCAG browser proof
        working-directory: web
        run: npx playwright test e2e/accessibility-i18n.spec.ts --project=chromium

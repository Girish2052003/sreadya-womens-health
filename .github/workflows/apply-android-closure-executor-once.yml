name: Execute Android closure patch once

on:
  push:
    branches: [feat/worldwide-v1]
    paths:
      - '.github/workflows/apply-android-closure-executor-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldwide-v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Extract and run audited patch recipe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-android-worldwide-closure-once.yml')
          text = source.read_text(encoding='utf-8')
          start_marker = '        run: |\n'
          end_marker = '      - name: Canonically format and validate changed source\n'
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  raise SystemExit(f'Unexpected patch indentation: {line!r}')
          patch = Path('/tmp/sreva_android_closure_patch.py')
          patch.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          compile(patch.read_text(encoding='utf-8'), str(patch), 'exec')
          PY
          python3 /tmp/sreva_android_closure_patch.py
      - name: Canonically format and validate source
        run: |
          dart format \
            lib/features/backup/data/cycle_vault_service.dart \
            lib/features/predictions/domain/prediction_history.dart \
            lib/features/reminders/presentation/reminders_screen.dart \
            lib/features/health_integration/data/health_platform.dart \
            lib/features/health_integration/presentation/health_integration_screen.dart \
            lib/features/onboarding/presentation/onboarding_screen.dart
          python3 -m py_compile tool/configure_platforms.py tool/configure_android_tests.py
          git diff --check
      - name: Commit source patch and remove temporary executors
        run: |
          rm .github/workflows/apply-android-worldwide-closure-once.yml
          rm .github/workflows/apply-android-closure-executor-once.yml
          git config user.name 'Sreva CI'
          git config user.email '132274277+Girish2052003@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close Android worldwide production gaps'
          git push origin HEAD:feat/worldwide-v1

name: C2 Task 27 Release Hardening

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: c2-task27-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Frozen Task 27 contract
        run: python -m pytest -q verification/reference/test_task27_release_hardening.py

  sync-hardening:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sync_service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache-dependency-path: sync_service/go.sum
      - name: Go race and adversarial suite
        run: go test -race ./...
      - name: Bounded Task 27 sync-envelope fuzzing
        run: go test -run '^$' -fuzz '^FuzzTask27SyncEnvelope$' -fuzztime=5s ./internal/sync

  web-hardening:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked Web dependencies
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production static export
        run: npm run build
      - name: Verify deterministic Web performance budget
        run: python ../tool/verify_web_performance_budget.py --root out --config performance-budget.json
      - name: Install target browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser Task 27 WCAG/cache hardening
        run: npx playwright test e2e/task27-release-hardening.spec.ts --project=chromium --project=firefox --project=webkit

  mobile-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format guard for Task 27 recovery tests
        run: dart format --output=none --set-exit-if-changed test/hardening/task27_recovery_hardening_test.dart
      - name: Recovery corruption drills
        run: flutter test test/hardening/task27_recovery_hardening_test.dart

  release-scans:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Privacy boundary scan
        run: python tool/privacy_scan.py
      - name: Secret scan
        run: python tool/secret_scan.py
      - name: Locked Web dependency audit
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

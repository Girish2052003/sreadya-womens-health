name: Final Web Product Completeness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, final-web-product-completeness]

permissions:
  contents: read

jobs:
  product-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Enforce complete Web product surface
        run: python -m pytest -q verification/reference/test_web_product_completeness.py

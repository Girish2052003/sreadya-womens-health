name: Final Web Product Completeness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, final-web-product-completeness]

permissions:
  contents: read

jobs:
  product-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Enforce complete Web product surface
        run: python -m pytest -q verification/reference/test_web_product_completeness.py verification/reference/test_web_product_depth.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Enforce detailed product user stories
        working-directory: web
        run: npm test -- --run src/features/product-completeness-user-stories.test.tsx

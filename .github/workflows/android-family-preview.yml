name: Sreadya Android family preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sreadya-android-family-preview
  cancel-in-progress: false

env:
  SREADYA_PREVIEW_APPLICATION_ID: com.sreadya.health.sreadya.preview

jobs:
  family-preview:
    name: Verify and build full-capability family preview
    if: ${{ github.repository == 'Girish2052003/sreadya-womens-health' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: android-family-preview
    steps:
      - name: Set isolated runner signing path
        run: echo "SREADYA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sreadya-preview.jks" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Require dedicated preview signing and artifact-encryption secrets
        env:
          KEYSTORE_B64: ${{ secrets.SREADYA_PREVIEW_ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEY_PASSWORD }}
          ARTIFACT_PASSWORD: ${{ secrets.SREADYA_PREVIEW_ARTIFACT_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$ARTIFACT_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SREADYA_ANDROID_KEYSTORE_PATH"
          chmod 600 "$SREADYA_ANDROID_KEYSTORE_PATH"
          test -s "$SREADYA_ANDROID_KEYSTORE_PATH"

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: python -m py_compile tool/configure_platforms.py tool/configure_android_tests.py tool/configure_android_release.py tool/configure_android_preview.py tool/verify_android_signatures.py tool/verify_v1_traceability.py tool/release_backlog_scan.py tool/privacy_scan.py tool/secret_scan.py tool/generate_sbom.py
      - run: python -m pip install pytest
      - run: python -m pytest -q verification/reference
      - name: Verify exhaustive worldwide-v1 traceability
        run: python tool/verify_v1_traceability.py
      - name: Fail on release backlog markers
        run: python tool/release_backlog_scan.py
      - run: python tool/privacy_scan.py
      - name: Scan repository for committed credentials
        run: python tool/secret_scan.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: sync_service/go.sum
      - name: Scan Go modules with the required toolchain
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          (cd sync_service && govulncheck ./...)
          (cd verification/reference/task19_go && govulncheck ./...)
      - name: Dependency vulnerability scan (OSV, Dart and Web locks)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.3 \
            scan source -L /src/pubspec.lock -L /src/web/package-lock.json
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p build/security
          dart pub deps --json > build/security/pub-deps.json
          python tool/generate_sbom.py build/security/pub-deps.json build/security/sreadya-cyclonedx.json

      - name: Generate Android host
        run: flutter create --platforms=android --org com.sreadya.health .
      - name: Configure complete Sreadya Android host
        run: |
          python3 tool/configure_platforms.py android
          python3 tool/configure_platforms.py android --check
          python3 tool/configure_android_tests.py
          python3 tool/configure_android_tests.py --check
      - name: Apply family-preview application identity only
        run: |
          python3 tool/configure_android_preview.py
          python3 tool/configure_android_preview.py --check
          grep -F 'applicationId = "com.sreadya.health.sreadya.preview"' android/app/build.gradle.kts
          grep -F 'android.permission.health.READ_MENSTRUATION' android/app/src/main/AndroidManifest.xml
      - name: Configure preview signing and Play-compatible target
        env:
          SREADYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEYSTORE_PASSWORD }}
          SREADYA_ANDROID_KEY_ALIAS: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEY_ALIAS }}
          SREADYA_ANDROID_KEY_PASSWORD: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEY_PASSWORD }}
        run: |
          python3 tool/configure_android_release.py --require-signing
          python3 tool/configure_android_release.py --check --require-signing
      - name: Run Android Kotlin release unit tests
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest --stacktrace
      - name: Build signed family-preview AAB and APK
        env:
          SREADYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEYSTORE_PASSWORD }}
          SREADYA_ANDROID_KEY_ALIAS: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEY_ALIAS }}
          SREADYA_ANDROID_KEY_PASSWORD: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          flutter build apk --release
      - name: Verify preview signatures
        env:
          SREADYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEYSTORE_PASSWORD }}
          SREADYA_ANDROID_KEY_ALIAS: ${{ secrets.SREADYA_PREVIEW_ANDROID_KEY_ALIAS }}
        run: |
          python3 tool/verify_android_signatures.py \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --apk build/app/outputs/flutter-apk/app-release.apk
      - name: Create preview release checksums
        run: |
          mkdir -p build/release
          cp build/app/outputs/bundle/release/app-release.aab build/release/sreadya-1.1.0+2-family-preview.aab
          cp build/app/outputs/flutter-apk/app-release.apk build/release/sreadya-1.1.0+2-family-preview.apk
          sha256sum build/release/sreadya-1.1.0+2-family-preview.aab build/release/sreadya-1.1.0+2-family-preview.apk > build/release/SHA256SUMS.txt
      - name: Encrypt family-preview release payload for public Actions storage
        env:
          ARTIFACT_PASSWORD: ${{ secrets.SREADYA_PREVIEW_ARTIFACT_PASSWORD }}
        run: |
          test -n "$ARTIFACT_PASSWORD"
          mkdir -p build/private-release-payload build/public-artifacts
          cp build/release/sreadya-1.1.0+2-family-preview.aab build/private-release-payload/
          cp build/release/sreadya-1.1.0+2-family-preview.apk build/private-release-payload/
          cp build/release/SHA256SUMS.txt build/private-release-payload/
          cp build/security/sreadya-cyclonedx.json build/private-release-payload/
          cp pubspec.lock build/private-release-payload/
          tar -C build/private-release-payload -czf "$RUNNER_TEMP/sreadya-1.1.0+2-family-preview-release.tar.gz" .
          printf '%s' "$ARTIFACT_PASSWORD" | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/sreadya-1.1.0+2-family-preview-release.tar.gz" \
            -out build/public-artifacts/sreadya-1.1.0+2-family-preview-release.tar.gz.enc \
            -pass stdin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sreadya-android-1.1.0-family-preview-encrypted
          path: build/public-artifacts/sreadya-1.1.0+2-family-preview-release.tar.gz.enc
          retention-days: 30
      - name: Remove preview signing and plaintext release material
        if: always()
        run: |
          rm -f "$SREADYA_ANDROID_KEYSTORE_PATH"
          rm -f "$RUNNER_TEMP/sreadya-1.1.0+2-family-preview-release.tar.gz"
          rm -rf build/private-release-payload build/release

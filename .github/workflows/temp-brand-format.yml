name: Temporary brand Dart formatter

on:
  push:
    branches:
      - release/android-formal-closure-v2
    paths:
      - .github/workflows/temp-brand-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: release/android-formal-closure-v2
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: |
          dart format lib/brand/sreadya_brand.dart
          dart format --output=none --set-exit-if-changed lib/brand/sreadya_brand.dart
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/brand/sreadya_brand.dart; then
            exit 0
          fi
          git config user.name "sreadya-format-bot"
          git config user.email "sreadya-format-bot@users.noreply.github.com"
          git add lib/brand/sreadya_brand.dart
          git commit -m "style: format Sreadya brand asset loader"
          git push origin HEAD:release/android-formal-closure-v2

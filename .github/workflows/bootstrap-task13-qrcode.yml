name: Bootstrap Task 13 QR dependency

on:
  push:
    branches:
      - feat/c2-a-g-implementation
    paths:
      - .github/workflows/bootstrap-task13-qrcode.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Task 13 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/c2-a-g-implementation
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate exact npm lock update
        working-directory: web
        run: npm install --save-exact qrcode.react@4.2.0

      - name: Commit generated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          if git diff --cached --quiet; then
            echo "Pinned dependency already present."
            exit 0
          fi
          git commit -m "web: pin local QR renderer dependency"
          git push origin HEAD:feat/c2-a-g-implementation

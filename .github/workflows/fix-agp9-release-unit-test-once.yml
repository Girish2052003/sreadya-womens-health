name: Fix AGP 9 release unit-test gate once

on:
  push:
    branches: [feat/worldwide-v1]
    paths:
      - '.github/workflows/fix-agp9-release-unit-test-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldwide-v1
      - name: Apply documented AGP 9 release-unit-test compatibility fix
        shell: python
        run: |
          from pathlib import Path

          tests = Path('tool/configure_android_tests.py')
          text = tests.read_text(encoding='utf-8')

          old = '''    gradle = ROOT / "android" / "app" / "build.gradle.kts"\n    require(gradle, "generated Android Gradle file")\n    text = gradle.read_text(encoding="utf-8")\n'''
          new = '''    gradle = ROOT / "android" / "app" / "build.gradle.kts"\n    properties = ROOT / "android" / "gradle.properties"\n    require(gradle, "generated Android Gradle file")\n    require(properties, "generated Android Gradle properties")\n    text = gradle.read_text(encoding="utf-8")\n'''
          if text.count(old) != 1:
              raise SystemExit('configure() anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''        gradle.write_text(text, encoding="utf-8")\n\n    source = ROOT / "platform_templates" / "android" / "ReminderWallClockTest.kt"\n'''
          new = '''        gradle.write_text(text, encoding="utf-8")\n\n    # AGP 9 enables unit tests only for the tested build type by default,\n    # which removes testReleaseUnitTest. Sreva intentionally verifies the\n    # production release variant, so restore unit-test components for all\n    # build types using AGP's documented compatibility property.\n    unit_test_property = "android.onlyEnableUnitTestForTheTestedBuildType=false"\n    properties_text = properties.read_text(encoding="utf-8")\n    if unit_test_property not in properties_text.splitlines():\n        properties.write_text(\n            properties_text.rstrip() + "\\n" + unit_test_property + "\\n",\n            encoding="utf-8",\n        )\n\n    source = ROOT / "platform_templates" / "android" / "ReminderWallClockTest.kt"\n'''
          if text.count(old) != 1:
              raise SystemExit('property insertion anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    gradle = ROOT / "android" / "app" / "build.gradle.kts"\n    test = (\n'''
          new = '''    gradle = ROOT / "android" / "app" / "build.gradle.kts"\n    properties = ROOT / "android" / "gradle.properties"\n    test = (\n'''
          if text.count(old) != 1:
              raise SystemExit('check() anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    require(gradle, "configured Android Gradle file")\n    require(test, "materialized Android reminder test")\n    gradle_text = gradle.read_text(encoding="utf-8")\n'''
          new = '''    require(gradle, "configured Android Gradle file")\n    require(properties, "configured Android Gradle properties")\n    require(test, "materialized Android reminder test")\n    gradle_text = gradle.read_text(encoding="utf-8")\n    properties_text = properties.read_text(encoding="utf-8")\n'''
          if text.count(old) != 1:
              raise SystemExit('check require anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    if 'testImplementation("junit:junit:4.13.2")' not in gradle_text:\n        raise SystemExit("JUnit dependency is missing")\n'''
          new = '''    if 'testImplementation("junit:junit:4.13.2")' not in gradle_text:\n        raise SystemExit("JUnit dependency is missing")\n    if "android.onlyEnableUnitTestForTheTestedBuildType=false" not in properties_text.splitlines():\n        raise SystemExit("AGP 9 release unit-test compatibility property is missing")\n'''
          if text.count(old) != 1:
              raise SystemExit('check property anchor mismatch')
          text = text.replace(old, new, 1)
          tests.write_text(text, encoding='utf-8')

          for path_str in ('.github/workflows/ci.yml', '.github/workflows/android-production.yml'):
              path = Path(path_str)
              body = path.read_text(encoding='utf-8')
              old_task = 'run: ./gradlew testReleaseUnitTest --stacktrace'
              new_task = 'run: ./gradlew :app:testReleaseUnitTest --stacktrace'
              if body.count(old_task) != 1:
                  raise SystemExit(f'{path}: expected exactly one release-test task invocation')
              path.write_text(body.replace(old_task, new_task, 1), encoding='utf-8')

          structural = Path('verification/reference/test_v1_closure_structure.py')
          body = structural.read_text(encoding='utf-8')
          old = '''def test_release_ci_builds_android_installable_and_store_artifacts_and_sbom():\n    ci = read(".github/workflows/ci.yml")\n    assert "testReleaseUnitTest" in ci\n'''
          new = '''def test_release_ci_builds_android_installable_and_store_artifacts_and_sbom():\n    ci = read(".github/workflows/ci.yml")\n    android_tests = read("tool/configure_android_tests.py")\n    assert ":app:testReleaseUnitTest" in ci\n    assert "android.onlyEnableUnitTestForTheTestedBuildType=false" in android_tests\n'''
          if body.count(old) != 1:
              raise SystemExit('structural-test anchor mismatch')
          structural.write_text(body.replace(old, new, 1), encoding='utf-8')
      - name: Validate repair source syntax and diff
        run: |
          python3 -m py_compile tool/configure_android_tests.py
          git diff --check
          git diff -- tool/configure_android_tests.py .github/workflows/ci.yml .github/workflows/android-production.yml verification/reference/test_v1_closure_structure.py
      - name: Remove one-shot workflow and commit only intended files
        run: |
          rm .github/workflows/fix-agp9-release-unit-test-once.yml
          git config user.name 'Sreva CI'
          git config user.email '132274277+Girish2052003@users.noreply.github.com'
          git add tool/configure_android_tests.py .github/workflows/ci.yml .github/workflows/android-production.yml verification/reference/test_v1_closure_structure.py .github/workflows/fix-agp9-release-unit-test-once.yml
          git diff --cached --check
          git commit -m 'fix: restore AGP 9 release native unit-test gate'
          git push origin HEAD:feat/worldwide-v1

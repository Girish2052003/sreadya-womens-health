name: C2 Task 21 Passkey Account Identity

on:
  push:
    branches:
      - feat/task21-passkey-account-identity
    paths:
      - 'sync_service/**'
      - '.github/workflows/c2-task21-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c2-task21-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Resolve Task 21 dependency graph
        working-directory: sync_service
        run: go mod tidy
      - name: Verify passkey account identity boundary
        working-directory: sync_service
        run: go test ./...
      - name: Vet passkey account identity boundary
        working-directory: sync_service
        run: go vet ./...

name: C2 Task 28 Staged Acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c2-task28-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  staged-acceptance-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Frozen Task 28 reference contract
        run: python -m pytest -q verification/reference/test_task28_staged_acceptance.py
      - name: Verify staged acceptance ledger
        run: python tool/verify_task28_acceptance.py
      - name: Preserve explicit 258-ID cross-platform traceability
        run: python tool/verify_cross_platform_traceability.py
      - name: Preserve v1 worldwide traceability
        run: python tool/verify_v1_traceability.py
      - name: Preserve release backlog gate
        run: python tool/release_backlog_scan.py
      - name: Preserve privacy boundary scan
        run: python tool/privacy_scan.py
      - name: Preserve secret scan
        run: python tool/secret_scan.py

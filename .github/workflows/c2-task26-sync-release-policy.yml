name: C2 Task 26 Sync Release Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: c2-task26-sync-release-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  task26-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Execute Task 26 sync release policy contract
        run: python -m pytest -q verification/reference/test_task26_sync_release_policy.py

name: C2 Task 24 Mobile E2EE Continuity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'lib/core/crypto/e2ee/**'
      - 'lib/features/account/**'
      - 'lib/features/sync/**'
      - 'platform_templates/android/SrevaCredentialBridge.kt'
      - 'platform_templates/ios/SrevaCredentialBridge.swift'
      - 'tool/configure_platforms.py'
      - 'test/conformance/e2ee_vectors_mobile_test.dart'
      - 'shared/crypto/**'
      - 'shared/sync/**'
      - '.github/workflows/c2-task24-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c2-task24-mobile-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-mobile-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify Task 24 formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/core/crypto/e2ee
          lib/features/account
          lib/features/sync
          test/conformance/e2ee_vectors_mobile_test.dart
      - name: Analyze complete Flutter client
        run: flutter analyze
      - name: Verify shared E2EE and sync vectors through production mobile adapters
        run: flutter test test/conformance/e2ee_vectors_mobile_test.dart
      - name: Preserve the existing mobile health regression suite
        run: flutter test

  android-passkey-adapter:
    runs-on: ubuntu-latest
    needs: flutter-mobile-continuity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android --org com.sreva.health .
      - name: Materialize Android passkey boundary
        run: |
          python3 tool/configure_platforms.py android
          python3 tool/configure_platforms.py android --check
      - name: Compile Android native credential bridge
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --stacktrace

  ios-passkey-adapter:
    runs-on: macos-26
    needs: flutter-mobile-continuity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=ios --org com.sreva.health .
      - name: Materialize iOS passkey boundary
        run: |
          python3 tool/configure_platforms.py ios
          python3 tool/configure_platforms.py ios --check
      - name: Compile iOS native credential bridge
        run: flutter build ios --debug --no-codesign

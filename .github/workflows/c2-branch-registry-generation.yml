name: C2 Branch Registry Generation

on:
  push:
    branches:
      - feat/c2-a-g-implementation

permissions:
  contents: write

jobs:
  generate-registry:
    if: ${{ github.repository == 'Girish2052003/sreva-womens-health' && github.ref == 'refs/heads/feat/c2-a-g-implementation' && github.actor == 'Girish2052003' && !contains(github.event.head_commit.message, '[c2-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/c2-a-g-implementation
      - name: Generate approved 258-ID registry
        run: python tool/generate_c2_capability_registry.py
      - name: Commit only the generated capability registry
        run: |
          test -f shared/capabilities/sreva-capabilities.v1.json
          git config user.name "GIRISH NALLAN CHAKRAVATHY"
          git config user.email "132274277+Girish2052003@users.noreply.github.com"
          git add shared/capabilities/sreva-capabilities.v1.json
          git diff --cached --quiet && exit 0
          git commit -m "contracts: generate 258-id Sreva capability registry [c2-generated]"
          git push origin HEAD:feat/c2-a-g-implementation
